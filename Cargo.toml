[package]
name = "kalshi-sdk-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Asynchronous Rust SDK for the Kalshi Predictions REST and WebSocket APIs"
readme = "README.md"
keywords = ["kalshi", "sdk", "prediction-markets", "websocket"]
categories = ["api-bindings", "asynchronous"]
exclude = ["spec/", "tools/"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
pem = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
ring = "0.17"
rust_decimal = { version = "1.40", features = ["serde-with-arbitrary-precision"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2"
zeroize = "1"

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "signal"] }
wiremock = "0.6"
uuid = { version = "1", features = ["v4"] }
